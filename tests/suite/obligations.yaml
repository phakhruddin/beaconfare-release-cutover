{
  "schema_version": "1.1",
  "benchmark": "BeaconFare Release Cutover",
  "total_points": 100,
  "pass_threshold": 100,
  "categories": [
    {
      "id": "release_safety",
      "label": "Verified promotion and defective-release rejection",
      "weight": 12,
      "obligations": [
        "lifecycle.zero_downtime_promotion",
        "lifecycle.defective_release_rejected"
      ]
    },
    {
      "id": "release_lock",
      "label": "Exclusive release lock and side-effect-free refusals",
      "weight": 11,
      "obligations": [
        "lifecycle.exclusive_release_lock",
        "lifecycle.refusals_side_effect_free"
      ]
    },
    {
      "id": "release_record",
      "label": "Durable release record and independent recovery",
      "weight": 8,
      "obligations": [
        "lifecycle.state_recovered_from_record"
      ]
    },
    {
      "id": "crash_recovery",
      "label": "Crash points and takeover recovery",
      "weight": 8,
      "obligations": [
        "lifecycle.crash_points_recovered"
      ]
    },
    {
      "id": "operator_record",
      "label": "Operator-edited release record and proven rollback targets",
      "weight": 37,
      "obligations": [
        "lifecycle.operator_directives_applied",
        "lifecycle.unverified_standby_proven",
        "lifecycle.undeployable_record_refused"
      ]
    },
    {
      "id": "rollback_repair",
      "label": "Instant rollback, drift and repair, stable state",
      "weight": 11,
      "obligations": [
        "lifecycle.instant_rollback",
        "lifecycle.drift_restored",
        "lifecycle.repair_without_disruption",
        "lifecycle.reapply_stable"
      ]
    },
    {
      "id": "topology",
      "label": "Blue/green topology",
      "weight": 5,
      "obligations": [
        "declared.release_topology",
        "realized.initial_release"
      ]
    },
    {
      "id": "product",
      "label": "Product traffic",
      "weight": 1,
      "obligations": [
        "observed.quotes_roundtrip"
      ]
    },
    {
      "id": "platform",
      "label": "Managed platform and isolation",
      "weight": 5,
      "obligations": [
        "declared.managed_iac",
        "declared.identity_data_logs"
      ]
    },
    {
      "id": "teardown",
      "label": "Destruction",
      "weight": 2,
      "obligations": [
        "lifecycle.destroy_clean"
      ]
    }
  ],
  "planes": {
    "declared": 7,
    "realized": 3,
    "observed": 1,
    "lifecycle": 89
  },
  "hard_gates": [
    "trial.integrity",
    "declared.managed_iac",
    "lifecycle.no_defective_traffic",
    "lifecycle.baseline_preserved"
  ],
  "score_caps": {
    "defective_release_served": 39,
    "cleanup_leak": 79
  },
  "obligations": [
    {
      "id": "declared.managed_iac",
      "plane": "declared",
      "weight": 2,
      "hard_gate": "declared.managed_iac",
      "fidelity": "state",
      "implementation": "executable",
      "given": "a submission containing Terraform or OpenTofu infrastructure",
      "when": "the verifier reads machine-readable state",
      "then": [
        "state parses and every scored resource family is managed",
        "the load balancer, both listeners, both target groups, both color services the quotes table and the release lock table named in the manifest are in state"
      ],
      "deadline_seconds": 120
    },
    {
      "id": "declared.release_topology",
      "plane": "declared",
      "weight": 2,
      "fidelity": "state",
      "implementation": "executable",
      "given": "the release-process, ALB and ECS contracts",
      "when": "listeners, target groups, services and task definitions are read from state",
      "then": [
        "the production and preview listeners use the configured ports and each forwards to exactly one, different, color target group",
        "both target groups register ip targets and health-check /health/ready",
        "each color service runs in private subnets without a public IP, behind its own target group on 8080",
        "every task definition a color service uses selects a supplied image and sets DEPLOYMENT_COLOR to that color"
      ],
      "deadline_seconds": 60
    },
    {
      "id": "declared.identity_data_logs",
      "plane": "declared",
      "weight": 3,
      "fidelity": "state",
      "implementation": "executable",
      "given": "the IAM, DynamoDB and logging contracts",
      "when": "roles, the quotes table and log groups are read from state",
      "then": [
        "the quotes table is keyed on quote_id (S), on-demand, with TTL on expires_at",
        "the release lock table is named <prefix>-release-lock, keyed on lock_id (S), on-demand",
        "the execution role only ships logs; the task role only uses the four quote actions on the quotes table",
        "no policy grants a wildcard action or resource",
        "every task definition family has a managed /ecs/<family> log group retained for exactly the configured days"
      ],
      "note": "Declaration only for IAM: this endpoint records policies without evaluating them.",
      "deadline_seconds": 60
    },
    {
      "id": "realized.initial_release",
      "plane": "realized",
      "weight": 3,
      "fidelity": "real",
      "implementation": "executable",
      "given": "a completed first deploy",
      "when": "listeners, target health, services and production responses are read live",
      "then": [
        "production forwards to one color and preview to the other",
        "the live color has the configured number of healthy targets and running tasks; the standby color runs none",
        "every production response comes from the initial release in the live color, from more than one task",
        "the manifest records the initial outcome"
      ],
      "deadline_seconds": 180
    },
    {
      "id": "observed.quotes_roundtrip",
      "plane": "observed",
      "weight": 1,
      "fidelity": "real",
      "implementation": "executable",
      "given": "a ready deployment",
      "when": "fresh quotes are issued and read back through production",
      "then": [
        "each quote is issued by the live release and stored",
        "each quote reads back with the same fare and the release that priced it",
        "the quotes table holds the items"
      ],
      "deadline_seconds": 120
    },
    {
      "id": "lifecycle.zero_downtime_promotion",
      "plane": "lifecycle",
      "weight": 6,
      "fidelity": "real",
      "implementation": "executable",
      "given": "the initial release live under continuous production traffic; every release warms up for tens of seconds after start",
      "when": "deploy runs with a correct later release requested",
      "then": [
        "deploy waits out the candidate's warm-up instead of judging or promoting it early",
        "no production request fails while deploy runs and the release changes over exactly once",
        "when deploy returns, production serves only the new release from the other color and preview serves the old release",
        "the previously live tasks are still running, unchanged, as a warm standby",
        "every quote written during the release reads back",
        "quotes issued before the release keep their original fare and pricing release after cutover",
        "the manifest records the promotion"
      ],
      "deadline_seconds": 900
    },
    {
      "id": "lifecycle.instant_rollback",
      "plane": "lifecycle",
      "weight": 4,
      "fidelity": "real",
      "implementation": "executable",
      "given": "a promoted release with the previous release running as warm standby",
      "when": "deploy runs with the previous release requested under continuous traffic",
      "then": [
        "no production request fails",
        "production serves the previous release from exactly the standby tasks, with no new task started",
        "preview serves the release that was live, still warm",
        "the manifest records the rollback"
      ],
      "deadline_seconds": 900
    },
    {
      "id": "lifecycle.drift_restored",
      "plane": "lifecycle",
      "weight": 4,
      "fidelity": "real",
      "implementation": "executable",
      "given": "a warm blue/green pair whose listeners were swapped and whose standby was scaled down outside deploy.sh",
      "when": "deploy runs with no release requested under continuous traffic",
      "then": [
        "no production request fails",
        "production and preview forward to the recorded live and standby colors again",
        "the standby runs its recorded release at the recorded count and live tasks are untouched",
        "the manifest records an unchanged release"
      ],
      "deadline_seconds": 900
    },
    {
      "id": "lifecycle.defective_release_rejected",
      "plane": "lifecycle",
      "weight": 6,
      "hard_gate": "lifecycle.no_defective_traffic",
      "fidelity": "real",
      "implementation": "executable",
      "given": "a healthy deployment under continuous production traffic",
      "when": "deploy runs with the release that carries the pricing regression requested, then a correct later release is requested from the rejected zero-capacity standby",
      "then": [
        "deploy exits successfully",
        "no production response comes from the defective release and none fails",
        "production and its tasks are exactly as before",
        "the standby color runs no tasks afterwards",
        "the manifest records the rejection",
        "the later correct release is staged from the zero-capacity standby, verified and promoted without replacing the original live tasks"
      ],
      "deadline_seconds": 1800
    },
    {
      "id": "lifecycle.exclusive_release_lock",
      "plane": "lifecycle",
      "weight": 5,
      "fidelity": "real",
      "implementation": "executable",
      "given": "a healthy deployment and the release lock table from release-lock.md",
      "when": "an expired lease is planted and a candidate deploy runs; then a live lease held by another holder is planted and a deploy is requested",
      "then": [
        "no lock item is left behind by earlier runs",
        "the expired lease is replaced by one lock held by this run, with lease_expires_at = acquisition + lock_lease_seconds, for the whole run",
        "the run releases its lock when it ends and no production request fails",
        "with a live foreign lease the run exits 75 within 30 seconds",
        "the refused run changes no submission file, no routing, no task, and leaves the foreign lock untouched"
      ],
      "deadline_seconds": 1800
    },
    {
      "id": "lifecycle.refusals_side_effect_free",
      "plane": "lifecycle",
      "weight": 6,
      "fidelity": "real",
      "implementation": "executable",
      "given": "a healthy deployment, the refusal rules in release-process.md and the release lock",
      "when": "unknown releases are requested (also under a live foreign lease), then a no-release run is requested while the standby count and preview listener have drifted and a foreign lease is live, then the lease is removed and deploy runs again",
      "then": [
        "each unknown release (exact matching, near misses included) exits 64 within 30 seconds",
        "an unknown release under a live foreign lease exits 64 and the lease is untouched",
        "the no-release run under a live foreign lease exits 75 within 30 seconds and repairs none of the drift",
        "no refused run changes a submission file, manifest, listener, ECS desired count or task definition, live task lock item or release record, and no production request fails",
        "once the lease is gone, the next run restores the recorded routing and standby count without touching live tasks and records an unchanged outcome"
      ],
      "deadline_seconds": 3900
    },
    {
      "id": "lifecycle.state_recovered_from_record",
      "plane": "lifecycle",
      "weight": 8,
      "fidelity": "real",
      "implementation": "executable",
      "given": "the cloud release record contract in release-record.md",
      "when": "a known-good release is promoted, the submission directory is replaced by a fresh copy of the handed-over submission keeping only infra/terraform.tfstate, a no-release run follows, then the warm standby's release is requested",
      "then": [
        "before and after every run the record matches what is deployed: live color, task counts, the release each non-idle color serves and the manifest's last request",
        "the promotion moves the generation by exactly one",
        "on the fresh worker the no-release run changes no routing, starts or stops no task, records unchanged and keeps the generation",
        "the rollback to the warm standby reuses exactly its tasks and moves the generation by exactly one",
        "no production request fails"
      ],
      "deadline_seconds": 2700
    },
    {
      "id": "lifecycle.crash_points_recovered",
      "plane": "lifecycle",
      "weight": 8,
      "fidelity": "real",
      "implementation": "executable",
      "given": "the named crash points, crash leftovers and recovery rules in crash-recovery.md, with a warm blue/green pair",
      "when": "the defective release is requested with BEACONFARE_FAULT_POINT=staged, a no-release run is attempted under the crashed holder's lease, the lease is expired and a no-release run follows; then the warm standby's release is requested with BEACONFARE_FAULT_POINT=switched, the lease is expired and a no-release run follows",
      "then": [
        "each crashed run exits 137 and leaves its lock item with a live lease, the release record's documented attributes and manifest.json unchanged",
        "at staged the candidate runs api_desired_count warm tasks behind preview while production and its tasks are untouched; at switched production and preview forward to the rollback's colors using exactly the warm standby tasks",
        "while the crashed holder's lease is live a run is refused with 75 and changes nothing",
        "after the lease is expired the next run restores the recorded routing and each color's recorded release and count, starts or stops no task of a color that already runs its recorded release, records unchanged, keeps the generation and releases its lock",
        "no production request fails and production is never answered by the staged candidate"
      ],
      "deadline_seconds": 3000
    },
    {
      "id": "lifecycle.operator_directives_applied",
      "plane": "lifecycle",
      "weight": 14,
      "fidelity": "real",
      "implementation": "executable",
      "given": "a verified warm blue/green pair and rule 5 of release-record.md (operators may edit the record)",
      "when": "an operator points live_color at the warm standby, then sets the new standby's count to 0, then restores it with a verified release at api_desired_count, with a no-release run after each edit under continuous traffic",
      "then": [
        "after the swap production forwards to exactly the standby tasks and preview to the former live tasks, with no task started or stopped and a single changeover",
        "after the retirement the standby runs no tasks, the manifest standby version is null and the live tasks are untouched",
        "after the restoration the standby runs the operator's release at api_desired_count behind preview and the live tasks are untouched",
        "every run records unchanged, keeps the operator's generation, leaves an accurate record and releases its lock",
        "no production request fails"
      ],
      "deadline_seconds": 2400
    },
    {
      "id": "lifecycle.unverified_standby_proven",
      "plane": "lifecycle",
      "weight": 13,
      "fidelity": "real",
      "implementation": "executable",
      "given": "the verified list in release-record.md and the rollback rule in release-process.md",
      "when": "an operator places the defective release in the standby and a no-release run follows, then the defective release is requested; then the operator removes the standby's good release from verified, places it in the standby, a no-release run follows, and that release is requested",
      "then": [
        "the operator-placed defective standby runs behind preview and is never added to verified; production never answers from it",
        "requesting it is not a rollback: it is self-tested, rejected (outcome rejected), the standby scales to 0 and the generation moves by one",
        "the revoked release is not re-added to verified by being staged",
        "requesting the revoked release proves it first: outcome promoted, verified contains it again, the previous live tasks stay warm, the generation moves by one",
        "no production request fails"
      ],
      "deadline_seconds": 3000
    },
    {
      "id": "lifecycle.undeployable_record_refused",
      "plane": "lifecycle",
      "weight": 10,
      "fidelity": "real",
      "implementation": "executable",
      "given": "the Validity rules in release-record.md and the refusal rules in release-process.md",
      "when": "four undeployable records are planted one at a time (live color at 0 tasks, a count that is neither 0 nor api_desired_count, the live release missing from verified, an unknown release on a running color while a valid release is requested) and deploy runs after each; then the original record is put back and deploy runs with no release requested",
      "then": [
        "each run exits 65 within 30 seconds",
        "no refused run changes the record, the lock table, a submission file, the manifest, a listener, a desired count, a task definition or any task, and no production request fails",
        "with the record fixed, the next run records unchanged, keeps the generation and starts or stops no task"
      ],
      "deadline_seconds": 1500
    },
    {
      "id": "lifecycle.repair_without_disruption",
      "plane": "lifecycle",
      "weight": 2,
      "fidelity": "real",
      "implementation": "executable",
      "given": "a healthy deployment whose preview listener and standby service were deleted",
      "when": "deploy runs with no release requested under continuous traffic",
      "then": [
        "no production request fails and no live task is replaced",
        "the preview listener and the standby service exist again and preview forwards to the standby color",
        "the manifest records an unchanged release"
      ],
      "deadline_seconds": 900
    },
    {
      "id": "lifecycle.reapply_stable",
      "plane": "lifecycle",
      "weight": 1,
      "fidelity": "state+real",
      "implementation": "executable",
      "given": "a repaired deployment",
      "when": "a plan is generated directly against the submission's infrastructure directory",
      "then": [
        "the plan resolves every variable without running deploy",
        "no resource is planned for creation or deletion"
      ],
      "deadline_seconds": 900
    },
    {
      "id": "lifecycle.destroy_clean",
      "plane": "lifecycle",
      "weight": 2,
      "hard_gate": "lifecycle.baseline_preserved",
      "fidelity": "real",
      "implementation": "executable",
      "given": "the inventory captured before deployment, including pre-existing legacy resources",
      "when": "destroy runs and the environment is inventoried again",
      "then": [
        "no resource carrying this deployment's prefix remains",
        "the pre-existing legacy table, cluster and log group are untouched"
      ],
      "deadline_seconds": 1200
    }
  ]
}
